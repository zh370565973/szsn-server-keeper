openapi: 3.0.3
info:
  title: Server Resource Manager API
  version: 1.0.0-M2
  description: |
    M2 已开放 CPU 控制写接口（启动/暂停/恢复/停止/改目标），成功返回 202 且不假定引擎已调到目标。
    开关每次进程启动都是 OFF。COMBINED 启动已开放（失败回收两侧）；MEMORY 单独与模板/计划写接口仍返回 503 / CONTROL_UNAVAILABLE。
servers:
  - url: /api/v1
paths:
  /auth/csrf:
    get:
      x-phase: M1
      summary: 获取 CSRF 令牌
      security: []
      responses:
        "200": { description: 令牌 }
  /auth/login:
    post:
      x-phase: M1
      summary: 登录
      responses:
        "200": { description: 已登录 }
        "401": { description: 口令错误 }
        "403": { description: CSRF 失败 }
        "429": { description: 登录冷却 }
        "503": { description: 口令未初始化或日志不可写 }
  /auth/logout:
    post:
      x-phase: M1
      summary: 注销并关闭该会话的 SSE
      responses:
        "200": { description: 已注销 }
  /auth/me:
    get:
      x-phase: M1
      summary: 当前会话
      responses:
        "200": { description: 用户名 }
        "401": { description: 未登录 }
  /system/info:
    get:
      x-phase: M1
      summary: 环境、能力与禁用原因
      responses:
        "200": { description: 环境诊断 }
  /monitor/current:
    get:
      x-phase: M1
      summary: 最新快照
      responses:
        "200": { description: 快照，含 sequence、observedAt、ageMs、quality }
        "503": { description: 尚无快照 }
  /monitor/stream:
    get:
      x-phase: M1
      summary: SSE，事件 metric、resource、safety、heartbeat
      responses:
        "200": { description: text/event-stream，id 为 bootId:sequence }
        "401": { description: 未登录 }
        "429": { description: 连接超过 5 }
  /monitor/history:
    get:
      x-phase: M1
      summary: 历史聚合，超过 2000 桶时自动加粗
      parameters:
        - in: query
          name: from
          schema: { type: integer, format: int64 }
          required: true
        - in: query
          name: to
          schema: { type: integer, format: int64 }
          required: true
        - in: query
          name: bucketSeconds
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: 桶列表 }
  /resource/status:
    get:
      x-phase: M3
      summary: 开关、锁存、健康窗口、当前实例、CPU 状态与三重内存预算预览
      responses:
        "200": { description: loadEngine=CPU；budget 为假分配器当前预算；成功字段不假定引擎已调到目标 }
  /resource/preflight:
    post:
      x-phase: M3
      summary: CPU/内存/联合预检，无副作用；MEMORY 仍 ok=false；COMBINED 返回预算与 workerCount
      responses:
        "200": { description: ok/reasons/workerCount/budget；不预留资源 }
  /executions:
    get:
      x-phase: M1
      summary: 执行记录分页，M1 为空
      responses:
        "200": { description: 空页 }
    post:
      x-phase: M3
      summary: 手动启动 CPU 或 COMBINED；MEMORY 仍 503；EXTRA_BYTES 超预算 422；联合任一引擎失败写 FAILED
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string, format: uuid }
          required: true
      responses:
        "202": { description: 已受理，status 多为 STARTING，engineCompleted=false }
        "422": { description: MEMORY_BUDGET_EXCEEDED，requestedBytes/allowedAdditionalBytes/limitingFactors，无分配 }
        "503": { description: CONTROL_UNAVAILABLE，环境不可控或内存引擎未开放 }
  /executions/{id}:
    get:
      x-phase: M4
      summary: 执行详情
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "404": { description: M1 没有执行实例 }
  /executions/{id}/targets:
    patch:
      x-phase: M2
      summary: 更新 CPU 目标
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "202": { description: 已受理，不假定 duty 已完成调节 }
        "503": { description: CONTROL_UNAVAILABLE }
  /executions/{id}/pause:
    post:
      x-phase: M2
      summary: 暂停
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "202": { description: 已受理 }
        "503": { description: CONTROL_UNAVAILABLE }
  /executions/{id}/resume:
    post:
      x-phase: M2
      summary: 恢复
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "202": { description: 已受理 }
        "503": { description: CONTROL_UNAVAILABLE }
  /executions/{id}/stop:
    post:
      x-phase: M2
      summary: 普通停止
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "202": { description: 已受理 STOPPING，不假定 Worker 已退出 }
        "503": { description: CONTROL_UNAVAILABLE }
  /resource/emergency-stop:
    post:
      x-phase: M2
      summary: 急停锁存，重复调用幂等
      responses:
        "200": { description: 开关 OFF 且已锁存；写库失败时本进程仍锁存 }
        "401": { description: 未登录 }
        "403": { description: 缺少 CSRF }
  /resource/reset-latch:
    post:
      x-phase: M2
      summary: 人工解除锁存
      responses:
        "200": { description: 锁存已解除，开关仍为 OFF }
        "409": { description: 仍有活动会话、指标未连续健康 30 秒，或解除期间再次急停 }
        "503": { description: 数据库不可写，锁存保持 }
  /resource/control-switch:
    put:
      x-phase: M2
      summary: 控制开关；开启不解除锁存，也不启动负载
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200": { description: 当前开关状态 }
        "400": { description: enabled 不是布尔值 }
        "409": { description: CONTROL_LATCHED，开启被拒绝 }
  /tasks:
    get:
      x-phase: M1
      summary: 模板列表，M1 为空
      responses:
        "200": { description: 空页 }
    post:
      x-phase: M4
      summary: 创建模板
      responses:
        "503": { description: CONTROL_UNAVAILABLE }
  /tasks/{id}:
    get:
      x-phase: M4
      summary: 模板详情
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "404": { description: 不存在 }
    put:
      x-phase: M4
      summary: 修改模板
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "503": { description: CONTROL_UNAVAILABLE }
    delete:
      x-phase: M4
      summary: 软删除模板
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "503": { description: CONTROL_UNAVAILABLE }
  /tasks/{id}/run:
    post:
      x-phase: M4
      summary: 按模板运行
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "503": { description: CONTROL_UNAVAILABLE }
  /schedules:
    get:
      x-phase: M1
      summary: 计划列表，M1 为空
      responses:
        "200": { description: 空页 }
    post:
      x-phase: M4
      summary: 创建计划
      responses:
        "503": { description: CONTROL_UNAVAILABLE }
  /schedules/{id}:
    get:
      x-phase: M4
      summary: 计划详情
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "404": { description: 不存在 }
    put:
      x-phase: M4
      summary: 修改计划
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "503": { description: CONTROL_UNAVAILABLE }
    delete:
      x-phase: M4
      summary: 删除计划
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "503": { description: CONTROL_UNAVAILABLE }
  /schedules/{id}/enabled:
    put:
      x-phase: M4
      summary: 启停计划
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "503": { description: CONTROL_UNAVAILABLE }
  /settings:
    get:
      x-phase: M1
      summary: 可见配置，不返回秘密
      responses:
        "200": { description: 只读设置 }
  /logs:
    get:
      x-phase: M1
      summary: 操作日志分页
      responses:
        "200": { description: 登录等操作日志 }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SRM_SESSION
security:
  - sessionCookie: []
