openapi: 3.0.3
info:
  title: Server Resource Manager API
  version: 1.0.0-M1
  description: |
    与 Maven 制品版本一致，不另立发版号。接口面已包含 M3 的 CPU/MEMORY/COMBINED 控制写接口（启动/暂停/恢复/停止/改目标），成功返回 202 且不假定引擎已达目标。
    公开启动在落库前校验：durationSeconds 为 10 秒–7 天，memoryTargetPct 为 1–70，memoryTargetBytes 必须是 4MiB 整数倍；不合法返回 422，不写 STARTING。
    开关每次进程启动都是 OFF。EXTRA_BYTES 超预算返回 422 并给出 maxAllowedBytes，不静默改小目标。模板/计划写接口仍返回 503 / CONTROL_UNAVAILABLE。
servers:
  - url: /api/v1
paths:
  /auth/csrf:
    get:
      x-phase: M1
      summary: 获取 CSRF 令牌
      security: []
      responses:
        "200": { description: 令牌 }
  /auth/login:
    post:
      x-phase: M1
      summary: 登录
      responses:
        "200": { description: 已登录 }
        "401": { description: 口令错误 }
        "403": { description: CSRF 失败 }
        "429": { description: 登录冷却 }
        "503": { description: 口令未初始化或日志不可写 }
  /auth/logout:
    post:
      x-phase: M1
      summary: 注销并关闭该会话的 SSE
      responses:
        "200": { description: 已注销 }
  /auth/me:
    get:
      x-phase: M1
      summary: 当前会话
      responses:
        "200": { description: 用户名 }
        "401": { description: 未登录 }
  /system/info:
    get:
      x-phase: M1
      summary: 环境、能力与禁用原因
      responses:
        "200": { description: 环境诊断 }
  /monitor/current:
    get:
      x-phase: M1
      summary: 最新快照
      responses:
        "200": { description: 快照，含 sequence、observedAt、ageMs、quality }
        "503": { description: 尚无快照 }
  /monitor/stream:
    get:
      x-phase: M1
      summary: SSE，事件 metric、resource、safety、heartbeat
      responses:
        "200": { description: text/event-stream，id 为 bootId:sequence }
        "401": { description: 未登录 }
        "429": { description: 连接超过 5 }
  /monitor/history:
    get:
      x-phase: M1
      summary: 历史聚合，超过 2000 桶时自动加粗
      parameters:
        - in: query
          name: from
          schema: { type: integer, format: int64 }
          required: true
        - in: query
          name: to
          schema: { type: integer, format: int64 }
          required: true
        - in: query
          name: bucketSeconds
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: 桶列表 }
  /resource/status:
    get:
      x-phase: M3
      summary: 开关、锁存、健康窗口、当前实例、CPU 状态与三重内存预算预览
      responses:
        "200": { description: loadEngine=CPU_MEMORY；budget.maxAllowedBytes 为可输入最大值；成功字段不假定引擎已达目标 }
  /resource/preflight:
    post:
      x-phase: M3
      summary: CPU/内存/联合预检，无副作用；超预算时返回 maxAllowedBytes 且 ok=false
      responses:
        "200": { description: ok/reasons/workerCount/budget/maxAllowedBytes；不预留资源 }
  /executions:
    get:
      x-phase: M1
      summary: 执行记录分页，M1 为空
      responses:
        "200": { description: 空页 }
    post:
      x-phase: M3
      summary: 手动启动 CPU/MEMORY/COMBINED；EXTRA_BYTES 超预算 422（含 maxAllowedBytes，不静默改小）；联合失败回收两侧
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string, format: uuid }
          required: true
      responses:
        "202": { description: 已受理，status 多为 STARTING，engineCompleted=false }
        "422": { description: TARGET_INVALID（时长、1–70 系统占用、4MiB 对齐）或 MEMORY_BUDGET_EXCEEDED；均在落库前拒绝，无分配 }
        "503": { description: CONTROL_UNAVAILABLE，环境不可控或开关/锁存未满足 }
  /executions/{id}:
    get:
      x-phase: M4
      summary: 执行详情
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "404": { description: M1 没有执行实例 }
  /executions/{id}/targets:
    patch:
      x-phase: M2
      summary: 更新运行中的 CPU 或内存目标
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "202": { description: 已受理，不假定 duty 已完成调节 }
        "503": { description: CONTROL_UNAVAILABLE }
  /executions/{id}/pause:
    post:
      x-phase: M2
      summary: 暂停
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "202": { description: 已受理 }
        "503": { description: CONTROL_UNAVAILABLE }
  /executions/{id}/resume:
    post:
      x-phase: M2
      summary: 恢复
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "202": { description: 已受理 }
        "503": { description: CONTROL_UNAVAILABLE }
  /executions/{id}/stop:
    post:
      x-phase: M2
      summary: 普通停止
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "202": { description: 已受理 STOPPING，不假定 Worker 已退出 }
        "503": { description: CONTROL_UNAVAILABLE }
  /resource/emergency-stop:
    post:
      x-phase: M2
      summary: 急停锁存，重复调用幂等
      responses:
        "200": { description: 开关 OFF 且已锁存；写库失败时本进程仍锁存 }
        "401": { description: 未登录 }
        "403": { description: 缺少 CSRF }
  /resource/reset-latch:
    post:
      x-phase: M2
      summary: 人工解除锁存
      responses:
        "200": { description: 锁存已解除，开关仍为 OFF }
        "409": { description: 仍有活动会话、指标未连续健康 30 秒，或解除期间再次急停 }
        "503": { description: 数据库不可写，锁存保持 }
  /resource/control-switch:
    put:
      x-phase: M2
      summary: 控制开关；开启不解除锁存，也不启动负载
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200": { description: 当前开关状态 }
        "400": { description: enabled 不是布尔值 }
        "409": { description: CONTROL_LATCHED，开启被拒绝 }
  /tasks:
    get:
      x-phase: M4
      summary: 模板列表，不含已软删除；q 按名称包含匹配
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200": { description: 分页模板 }
    post:
      x-phase: M4
      summary: 创建模板。PUT 为整份替换，创建时不能带 expectedVersion
      responses:
        "200": { description: 新模板，version 为 1 }
        "400": { description: 请求格式不合法 }
        "422": { description: TARGET_INVALID，模式字段互斥或目标越界 }
  /tasks/{id}:
    get:
      x-phase: M4
      summary: 模板详情。已软删除视为不存在
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 模板 }
        "404": { description: 不存在 }
    put:
      x-phase: M4
      summary: 修改模板。必须带 expectedVersion；不改写已有执行实例
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 更新后的模板 }
        "400": { description: 缺少 expectedVersion 或格式不合法 }
        "404": { description: 不存在 }
        "409": { description: VERSION_CONFLICT }
        "422": { description: TARGET_INVALID；被计划引用且时长不合法时 TEMPLATE_NOT_SCHEDULABLE }
    delete:
      x-phase: M4
      summary: 软删除模板。被计划引用时 409 并列出计划
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 已软删除，历史执行快照保留 }
        "404": { description: 不存在 }
        "409": { description: TEMPLATE_REFERENCED，details.schedules 列出引用计划 }
  /tasks/{id}/run:
    post:
      x-phase: M4
      summary: 按当前模板创建实例。成功响应不假定引擎已完成；环境不可控时 503 且不落库
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202": { description: 已受理，engineCompleted 为 false }
        "400": { description: 缺少幂等键 }
        "404": { description: 模板不存在 }
        "422": { description: 目标或预算不合法，无执行记录 }
        "503": { description: CONTROL_UNAVAILABLE，无执行记录 }
  /schedules:
    get:
      x-phase: M4
      summary: 计划列表，按 nextFireAt、id 升序。本接口不触发计划
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200": { description: 分页计划 }
    post:
      x-phase: M4
      summary: 创建 ONCE、DAILY、WEEKLY 或 FIXED_INTERVAL。不接受 Cron。模板必须是不超过 24 小时的有限时长
      responses:
        "200": { description: 新计划，version 为 1，带 nextFireAt }
        "400": { description: 请求格式不合法 }
        "404": { description: 模板不存在 }
        "422": { description: SCHEDULE_INVALID、TEMPLATE_NOT_SCHEDULABLE 或 SCHEDULE_LIMIT }
  /schedules/{id}:
    get:
      x-phase: M4
      summary: 计划详情
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 计划 }
        "404": { description: 不存在 }
    put:
      x-phase: M4
      summary: 整份修改计划。必须带 expectedVersion，只影响以后的 nextFireAt，不改执行实例
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 更新后的计划 }
        "400": { description: 缺少 expectedVersion 或格式不合法 }
        "404": { description: 计划或模板不存在 }
        "409": { description: VERSION_CONFLICT }
        "422": { description: SCHEDULE_INVALID 或 TEMPLATE_NOT_SCHEDULABLE }
    delete:
      x-phase: M4
      summary: 删除计划。不改变已有执行实例
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 已删除 }
        "404": { description: 不存在 }
  /schedules/{id}/enabled:
    put:
      x-phase: M4
      summary: 启停计划。启用时重算 nextFireAt；一次性计划若开始时间已过则拒绝
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 更新后的计划 }
        "400": { description: 缺少 expectedVersion 或格式不合法 }
        "404": { description: 计划或模板不存在 }
        "409": { description: VERSION_CONFLICT }
        "422": { description: SCHEDULE_INVALID 或 TEMPLATE_NOT_SCHEDULABLE }
  /settings:
    get:
      x-phase: M1
      summary: 可见配置，不返回秘密
      responses:
        "200": { description: 只读设置 }
  /logs:
    get:
      x-phase: M1
      summary: 操作日志分页
      responses:
        "200": { description: 登录等操作日志 }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SRM_SESSION
security:
  - sessionCookie: []
